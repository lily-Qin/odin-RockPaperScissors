<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Rock Paper Scissors</title>
    <script defer src="javascript.js"></script>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #f6d365, #fda085);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        height: 100vh;
        margin: 0;
        padding: 20px;
      }

      h1 {
        color: #333;
        margin-bottom: 20px;
        font-size: 2.5rem;
      }

      #buttons {
        margin: 20px 0;
      }

      #buttons button {
        background: #fff;
        border: 2px solid #333;
        border-radius: 12px;
        padding: 12px 20px;
        margin: 0 10px;
        font-size: 1.2rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      #buttons button:hover {
        background: #333;
        color: #fff;
        transform: scale(1.05);
      }

      #buttons button:disabled {
        background: #ccc;
        color: #666;
        cursor: not-allowed;
        transform: none;
      }

      #results {
        font-size: 1.5rem;
        margin: 20px 0;
        font-weight: bold;
        color: #222;
        text-align: center;
      }

      #score {
        font-size: 1.2rem;
        margin-bottom: 20px;
        color: #444;
      }

      #restart {
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 1rem;
        cursor: pointer;
        display: none; /* 初始不显示 */
        transition: background 0.2s ease;
      }

      #restart:hover {
        background: #45a049;
      }
    </style>
  </head>
  <body>
    <h1>✊ ✋ ✌️ Rock Paper Scissors</h1>

    <div id="buttons">
      <button id="rock">✊ Rock</button>
      <button id="paper">✋ Paper</button>
      <button id="scissors">✌️ Scissors</button>
    </div>

    <div id="results">Make your choice to start!</div>
    <div id="score">Player: 0 - Computer: 0</div>

    <button id="restart">🔄 Restart Game</button>
  </body>
</html>
